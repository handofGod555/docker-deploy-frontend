name: Deploy frontend application

on:
  push:
    branches:
      - "main"
      - "feature/**"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            awesomekid/234-deploylab-frontend:latest
            awesomekid/234-deploylab-frontend:${{ github.ref_name }}

      - name: copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose-${{ contains(github.ref, 'feature/') && 'prod' || 'default' }}.yml"
          target: "/home/ubuntu/frontend-${{ github.ref_name }}"

      - name: docker compose
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HOST_SERVER }}
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            SANITIZED_BRANCH="${{ github.ref_name }}"
            DEPLOY_DIR="/home/ubuntu/frontend-${SANITIZED_BRANCH//\//-}"
            mkdir -p ${DEPLOY_DIR}
            cd ${DEPLOY_DIR}
            echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            docker compose -p "frontend-${SANITIZED_BRANCH//\//-}" down
            docker compose -p "frontend-${SANITIZED_BRANCH//\//-}" pull
            docker compose -p "frontend-${SANITIZED_BRANCH//\//-}" up -d